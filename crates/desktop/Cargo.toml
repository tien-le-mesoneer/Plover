[package]
name = "plover-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Plover desktop app: a Tauri shell around the embedded server"

[[bin]]
name = "plover"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
plover-cli = { version = "0.1.0", path = "../cli" }
plover-core = { path = "../core" }
plover-server = { path = "../server" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
