[package]
name = "brs-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "brs_server"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
brs-core = { path = "../core" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
