[package]
name = "plover-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "plover_server"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
plover-core = { path = "../core" }
rand = "0.10.3"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
ts-rs = "12.0.1"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
similar = "3.2.0"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
