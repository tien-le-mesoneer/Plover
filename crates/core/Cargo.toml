[package]
name = "brs-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "brs_core"

[dependencies]
base64 = "0.23.1"
pest = "2.9.4"
pest_derive = "2.9.4"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "cookies", "form", "http2", "rustls"] }
reqwest_cookie_store = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "time", "rt-multi-thread", "macros"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
similar = "3.2.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
