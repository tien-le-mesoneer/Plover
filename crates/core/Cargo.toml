[package]
name = "brs-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "brs_core"

[dependencies]
base64 = "0.23.1"
pest = "2.9.4"
pest_derive = "2.9.4"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "form", "gzip", "http2", "rustls"] }
reqwest_cookie_store = "0.10.0"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "time", "rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"
similar = "3.2.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
