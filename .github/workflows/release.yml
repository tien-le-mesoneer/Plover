name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds every package as workflow artifacts without creating a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            platform: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles app,dmg
            bundle-dir: target/universal-apple-darwin/release/bundle
          - name: Windows (x64)
            os: windows-latest
            platform: windows-x64
            rust-targets: ""
            tauri-args: --bundles nsis
            bundle-dir: target/release/bundle
          - name: Linux (x64)
            os: ubuntu-22.04
            platform: linux-x64
            rust-targets: ""
            tauri-args: --bundles deb,appimage
            bundle-dir: target/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Versions match the tag
        run: scripts/check-version.sh ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Linux system packages (WebKitGTK, Secret Service headers, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            crates/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
          npm run check:no-cdn

      - name: plv CLI
        run: |
          version=$(scripts/check-version.sh | sed 's/^version //')
          name="plv-$version-${{ matrix.platform }}"
          mkdir -p dist "pkg/$name"
          cp README.md LICENSE "pkg/$name/"
          case "${{ matrix.platform }}" in
            macos-universal)
              cargo build --release -p plover-cli --target aarch64-apple-darwin
              cargo build --release -p plover-cli --target x86_64-apple-darwin
              lipo -create -output "pkg/$name/plv" \
                target/aarch64-apple-darwin/release/plv target/x86_64-apple-darwin/release/plv
              tar -C pkg -czf "dist/$name.tar.gz" "$name" ;;
            windows-x64)
              cargo build --release -p plover-cli
              cp target/release/plv.exe "pkg/$name/"
              (cd pkg && 7z a -bd "../dist/$name.zip" "$name" > /dev/null) ;;
            linux-x64)
              cargo build --release -p plover-cli
              cp target/release/plv "pkg/$name/"
              tar -C pkg -czf "dist/$name.tar.gz" "$name" ;;
          esac
          "pkg/$name/plv" --version

      - name: Desktop bundles
        working-directory: crates/desktop
        run: |
          npm ci --no-fund --no-audit
          npx tauri build ${{ matrix.tauri-args }}

      - name: Collect bundles
        run: |
          shopt -s nullglob
          files=(${{ matrix.bundle-dir }}/dmg/*.dmg ${{ matrix.bundle-dir }}/nsis/*.exe
                 ${{ matrix.bundle-dir }}/deb/*.deb ${{ matrix.bundle-dir }}/appimage/*.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "no desktop bundles found"; exit 1; }
          cp "${files[@]}" dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --draft --generate-notes --title "Plover ${{ github.ref_name }}"
