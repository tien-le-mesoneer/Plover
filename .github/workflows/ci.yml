name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            bundles: app,dmg
            smoke: target/release/plover
          - name: Windows (x64)
            os: windows-latest
            bundles: nsis
            smoke: target/release/plover.exe
          - name: Linux (x64)
            os: ubuntu-22.04
            bundles: deb,appimage
            smoke: xvfb-run -a target/release/plover
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # Tests and the smoke run must never touch real keychain entries.
      PLOVER_KEYCHAIN_SERVICE: dev.plover.ci
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages (WebKitGTK, Secret Service headers, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libfuse2 xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            crates/core/js/package-lock.json
            crates/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Frontend checks and build
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run check:no-cdn

      - name: Script library bundles are up to date
        working-directory: crates/core/js
        run: |
          npm ci --no-fund --no-audit
          npm run check

      - name: cargo test
        # --no-fail-fast: report every failing test binary, not just the first.
        run: cargo test --workspace --no-fail-fast

      - name: CLI-only build
        run: cargo test -p plover-cli --no-default-features --test cli

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Desktop bundles
        working-directory: crates/desktop
        run: |
          npm ci --no-fund --no-audit
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Desktop smoke test
        shell: bash
        env:
          PLOVER_DESKTOP_SMOKE: "1"
          # Keep the smoke run's remembered collections out of the runner's config dir.
          PLOVER_STATE_DIR: ${{ runner.temp }}/plover-state
        run: ${{ matrix.smoke }}

      - uses: actions/upload-artifact@v4
        with:
          name: plover-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
